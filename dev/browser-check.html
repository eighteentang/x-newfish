<html lang="zh-CN">
<head>

    article { border: 1px solid #657786; padding: 16px; margin: 12px 0; }

  <script src="/dev/browser-storage.js"></script>

  <h1>X-Newfish 本地回归检查</h1>

    <article data-testid="tweet" id="a3"><header><a href="/trusted/status/103"><time>1h</time></a><button aria-label="Explain this post">Explain</button></header><div data-testid="tweetText">没有指标的普通中文</div></article>
    <article data-testid="tweet" id="a4"><header><a href="/tester/status/104"><time>1h</time></a></header><div data-testid="tweetText">Grok 工具介绍</div></article>
  </main>
  <h2 id="summary">检查运行中…</h2>

  <script src="/dev/browser-scenarios.js"></script>

</html>
